name: THALA AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out THALA AI
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract and validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s thala_ai.zip
          unzip -tq thala_ai.zip
          mkdir -p "$RUNNER_TEMP/thala-ai-source"
          unzip -q thala_ai.zip -d "$RUNNER_TEMP/thala-ai-source"
          PROJECT_DIR="$RUNNER_TEMP/thala-ai-source/thala_ai"

          # Apply the checked-in VoiceEngine source and migrate MainActivity to it.
          cp app/src/main/java/com/thala/assistant/VoiceEngine.kt "$PROJECT_DIR/app/src/main/java/com/thala/assistant/VoiceEngine.kt"
          python3 scripts/integrate_voice_engine.py "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/thala/assistant/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/thala/assistant/Brain.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/thala/assistant/Cloud.kt"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::Gradle completed without producing a debug APK."
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/THALA-AI-debug.apk
          sha256sum artifacts/THALA-AI-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: THALA-AI-Android-APK
          path: artifacts/THALA-AI-debug.apk
          if-no-files-found: error
          retention-days: 14
