name: One-time THALA AI APK import

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-thala-ai-apk
  cancel-in-progress: false

jobs:
  import-apk:
    name: Import built THALA AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4

      - name: Download the existing successful build artifact
        env:
          APK_ARCHIVE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4aac-8211-acaa-7651f63da274/raw?se=2026-11-20T12%3A18%3A06Z&sp=r&sv=2026-06-06&sr=b&scid=539f2ced-a24c-5e73-af6f-6f38b21ba559&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-20T04%3A11%3A46Z&ske=2026-11-21T04%3A11%3A46Z&sks=b&skv=2026-06-06&sig=4s6fiRGL5cvShnsyEaMm0jYFE8jTMcpT1ec6E%2BYBm9Q%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 3 "$APK_ARCHIVE_URL" --output "$RUNNER_TEMP/thala-ai-apk.zip"
          unzip -tq "$RUNNER_TEMP/thala-ai-apk.zip"
          mkdir -p downloads
          unzip -jo "$RUNNER_TEMP/thala-ai-apk.zip" 'THALA-AI-debug.apk' -d downloads
          test -s downloads/THALA-AI-debug.apk
          sha256sum downloads/THALA-AI-debug.apk > downloads/THALA-AI-debug.apk.sha256
          ls -lh downloads/THALA-AI-debug.apk
          cat downloads/THALA-AI-debug.apk.sha256

      - name: Commit APK to destination repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/THALA-AI-debug.apk downloads/THALA-AI-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "The APK and checksum are already present."
            exit 0
          fi
          git commit -m "Add THALA AI debug APK"
          git push origin "HEAD:${GITHUB_REF_NAME}"
